<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>e6 Protected Access</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #120f0a;
        --panel: rgba(27, 22, 15, 0.9);
        --line: rgba(255, 214, 153, 0.24);
        --text: #f6efe3;
        --muted: #b7ab98;
        --accent: #d98324;
        --accent-strong: #f0a54c;
        --danger: #ff8f7a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(217, 131, 36, 0.2), transparent 30%),
          radial-gradient(circle at bottom right, rgba(255, 239, 196, 0.14), transparent 28%),
          linear-gradient(160deg, #17120d, #090806 68%);
        color: var(--text);
        font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      }

      main {
        width: min(440px, 100%);
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 7vw, 42px);
        line-height: 1.05;
      }

      p {
        margin: 16px 0 0;
        color: var(--muted);
        line-height: 1.7;
      }

      form {
        margin-top: 28px;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-size: 13px;
        color: var(--muted);
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        padding: 15px 16px;
        font: inherit;
      }

      input:focus {
        outline: 2px solid rgba(240, 165, 76, 0.4);
        outline-offset: 2px;
      }

      button {
        width: 100%;
        margin-top: 14px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #1b160f;
        padding: 14px 18px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      #message {
        min-height: 24px;
        margin-top: 14px;
        color: var(--danger);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Protected Site</p>
      <h1>Access Required</h1>
      <p>このサイトは限定公開です。共有されたパスワードを入力してください。</p>

      <form id="unlock-form">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button id="submit-button" type="submit">Unlock</button>
        <div id="message" aria-live="polite"></div>
      </form>
    </main>

    <script>
      const form = document.getElementById('unlock-form')
      const passwordInput = document.getElementById('password')
      const submitButton = document.getElementById('submit-button')
      const message = document.getElementById('message')
      const next = new URLSearchParams(window.location.search).get('next') || '/'

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        submitButton.disabled = true
        message.textContent = ''

        try {
          const response = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: passwordInput.value }),
          })

          const payload = await response.json().catch(() => ({}))
          if (!response.ok) {
            throw new Error(payload.message || 'Unlock failed.')
          }

          window.location.replace(next)
        } catch (error) {
          message.textContent = error instanceof Error ? error.message : 'Unlock failed.'
          submitButton.disabled = false
          passwordInput.select()
        }
      })
    </script>
  </body>
</html>
